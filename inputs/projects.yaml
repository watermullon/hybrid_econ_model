projects:
  legacy_hybrid_fund:
    label: "Original hybrid fund scenarios"
    description: "Top-down demonstration scenarios from the original hybrid fund model."
    deals: []
    scenarios:
      - base_hit_everyone_happy
      - fast_success_crypto_bull
      - slow_grind
      - hedge_fund_failure_re_survival
      - real_estate_distress_crypto_success
      - exceptional_dynasty_outcome
      - liquidity_trap
      - failure_never_reaches_hurdle

  jon_deal_package:
    label: "Jon deal package"
    description: "Remote branch Jon deal scenarios, including downside, upside, property shock, and resized fund cases."
    deals:
      - jon_deal_1
    scenarios:
      - jon_base_case
      - jon_downside_case
      - jon_property_shock_25
      - jon_property_shock_40
